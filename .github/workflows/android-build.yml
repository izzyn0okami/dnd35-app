name: Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug keystore
        env:
          DND35_DEBUG_KEYSTORE_BASE64: ${{ secrets.DND35_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DND35_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure o segredo DND35_DEBUG_KEYSTORE_BASE64 nas configurações do repositório antes de compilar o APK."
            exit 1
          fi
          printf '%s' "$DND35_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Print test failures (diagnostic, temporary)
        if: failure()
        run: |
          for f in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/print_test_failures.py" "$f"
            fi
          done

      - name: Compile Android app
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd35-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
