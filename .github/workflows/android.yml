name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew testDebugUnitTest
      - name: Restore stable debug keystore
        env:
          DND35_DEBUG_KEYSTORE_BASE64: ${{ secrets.DND35_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DND35_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure o segredo DND35_DEBUG_KEYSTORE_BASE64 nas configurações do repositório antes de compilar o APK."
            exit 1
          fi
          printf '%s' "$DND35_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd35-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
